function addBubble(text,who){
let d=document.createElement('div');d.className='bubble '+who;d.innerText=text;
document.getElementById('msgs').appendChild(d);
document.getElementById('msgs').scrollTop=9999;
}
function mirichReply(q){
q=q.toLowerCase();
if(q.includes('hello')||q.includes('hi')||q.includes('good')) return 'Hello! Good to see you on Mirich. How can I help you today?';
if(q.includes('who are you')||q.includes('your name')) return 'I am Mirich AI, your private assistant inside Mirich. I can help you write messages, answer questions, and find chats.';
if(q.includes('alexander')) return 'Alexander is in your chats. Tap on Alexander to open his chat.';
if(q.includes('sophia')) return 'Sophia is in your chats. Tap on Sophia to open her chat.';
if(q.includes('james')) return 'James is in your chats. Tap on James to open his chat.';
if(q.includes('help')) return 'I can help you: 1) Type a question here, 2) Search for a person, 3) Open a chat and send a message. What do you want to do?';
if(q.includes('thank')) return 'You are welcome. Anything else?';
if(q.includes('bye')) return 'Goodbye for now. I will be here when you need me.';
return 'Great question: "'+q+'". Here is what I think: This is a good idea to explore in Mirich. Tell me more about what you want to do with it, and I will help you plan it step by step.';
}
function askMirich(){
let inp=document.getElementById('searchInput');
let q=inp.value.trim();
if(!q) return;
openChat('Mirich AI','M');
addBubble(q,'me');
setTimeout(function(){ addBubble(mirichReply(q),'other'); },500);
inp.value='';
}
function sendMsg(){
let inp=document.getElementById('msgInput');
if(!inp.value) return;
let q=inp.value;
addBubble(q,'me');
inp.value='';
if(currentChat==='Mirich AI'){
setTimeout(function(){ addBubble(mirichReply(q),'other'); },500);
}
}
document.getElementById('msgInput').addEventListener('keydown',function(e){ if(e.key==='Enter') sendMsg(); });
</script
