<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mirich</title>
<link rel="icon" type="image/jpeg" href="icon.png.jpg">
<link rel="apple-touch-icon" href="icon.png.jpg">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh}
body{background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.stickyTop{flex-shrink:0;background:#000;z-index:20;padding-top:10px;padding-bottom:6px;border-bottom:1px solid #111}
.main{flex:1;overflow-y:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 0}
.topbar b{font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:3px}
.topbar span{color:#C9A86A;font-size:15px;letter-spacing:3px}
.header{padding:28px 24px 8px;display:flex;justify-content:space-between;align-items:center}
.header b{font-family:Georgia,serif;font-size:44px;font-weight:400;letter-spacing:1px;display:flex;align-items:center;gap:12px}
.header b img{width:52px;height:52px;border-radius:14px;flex-shrink:0;object-fit:cover}
.header small{color:#999;font-size:17px;letter-spacing:3px;font-weight:400}
.dot{width:12px;height:12px;background:#00C853;border-radius:50%;display:inline-block;margin-left:8px;box-shadow:0 0 8px #00C853}
.search{margin:22px 24px 6px;background:#000;border:1px solid #555;padding:6px 22px;display:flex;align-items:center;gap:10px}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:21px;padding:18px 0}
.search input::placeholder{color:#999}
.search b{color:#2D7DFF;font-weight:400;font-size:21px;white-space:nowrap}
.divider{height:2px;background:linear-gradient(90deg,#FFC107 0%,#00C853 50%,#2D7DFF 100%);margin:18px 24px 6px;border-radius:2px}
.chat{display:flex;gap:20px;padding:28px 24px;cursor:pointer;border-bottom:1px solid #333;align-items:center}
.chat:active{background:#0D0D0D}
.avatar{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.a1{background:#0A1A2F;border:2px solid #2D7DFF}.a2{background:#0A1F14;border:2px solid #00C853}.a3{background:#2A0808;border:2px solid #FF5252}.a4{background:#111;border:2px solid #2D7DFF}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center}
.chat-top b{font-size:23px}
.chat-top span{font-size:16px;color:#888}
.chat p{font-size:19px;color:#bbb;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.green{color:#9ACD32}.yellow{color:#FFC107}
.footer-note{text-align:center;color:#666;font-size:13px;padding:28px;letter-spacing:2px}
.footer-note b{color:#FFC107}
.compose{position:fixed;right:22px;bottom:120px;background:#FFC107;color:#000;width:68px;height:68px;border-radius:50%;font-size:36px;border:none;box-shadow:0 8px 20px rgba(255,193,7,.4);z-index:10}
.bottom{flex-shrink:0;background:#000;border-top:1px solid #333;display:flex;justify-content:space-around;padding:18px 0 calc(20px + env(safe-area-inset-bottom))}
.bottom div{text-align:center;font-size:17px;color:#fff;letter-spacing:1px}
.bottom .active{color:#fff;font-weight:bold}
.bottom em{display:block;font-style:normal;font-size:22px;margin-bottom:6px}
#chatWindow{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;flex-direction:column;padding-top:18px;z-index:30}
#chatHeader{background:#000;padding:20px;display:flex;gap:14px;align-items:center;border-bottom:2px solid #222}
#msgs{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:82%;padding:14px 16px;font-size:19px;line-height:1.4;border-radius:14px}
.me{background:#2D7DFF;color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.other{background:#141414;align-self:flex-start;border:1px solid #222;border-bottom-left-radius:2px}
#inputBar{display:flex;gap:10px;padding:14px;background:#000;border-top:2px solid #222}
#inputBar input{flex:1;padding:16px 18px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:18px}
#inputBar button{background:#00C853;color:#000;border:none;width:58px;height:58px;border-radius:50%;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="stickyTop">
<div class="topbar"><b>MIRICH</b><span>PRIVATE MESSAGING</span></div>
<div class="header"><div><b><img src="icon.png.jpg" alt="Mirich"> Mirich <span class="dot"></span></b><br><small>MESSAGES</small></div><div style="color:#fff;font-size:28px">...</div></div>
<div class="search"><input id="searchInput" placeholder="Search or ask Mirich AI" onkeydown="if(event.key==='Enter') askMirich()"><b onclick="askMirich()">Ask</b></div>
<div class="divider"></div>
</div>
<div class="main">
<div class="chat" onclick="openChat('Mirich AI','M')">
<div class="avatar a4"><img src="icon.png.jpg"></div>
<div class="chat-info"><div class="chat-top"><b>Mirich AI</b><span>10:29</span></div><p>Welcome to Mirich. How can I assist you...</p></div>
</div>
<div class="chat" onclick="openChat('Alexander','A')">
<div class="avatar a1">A</div>
<div class="chat-info"><div class="chat-top"><b>Alexander</b><span>10:21</span></div><p><span class="green">✓✓</span> Certainly, let us proceed.</p></div>
</div>
<div class="chat" onclick="openChat('Sophia','S')">
<div class="avatar a2">S</div>
<div class="chat-info"><div class="chat-top"><b>Sophia</b><span>08:47</span></div><p><span class="green">✓✓</span> Understood. Thank you.</p></div>
</div>
<div class="chat" onclick="openChat('James','J')">
<div class="avatar a3">J</div>
<div class="chat-info"><div class="chat-top"><b>James</b><span>31 Oct</span></div><p><span class="green">✓✓</span> Noted.</p></div>
</div>
<div class="footer-note">MIRICH • <b>SECURE</b> • PRIVATE</div>
</div>
<button class="compose" onclick="openChat('Mirich AI','M')">+</button>
<div class="bottom">
<div class="active"><em>—</em>Chats</div>
<div><em>—</em>Feed</div>
<div><em>—</em>Calls</div>
<div><em>—</em>Profile</div>
</div>
<div id="chatWindow">
<div id="chatHeader"><span onclick="closeChat()" style="font-size:28px;cursor:pointer;color:#FFC107">←</span><div class="avatar a1" id="chatAvatar">A</div><b id="chatName" style="font-size:22px">Alexander</b></div>
<div id="msgs"></div>
<div id="inputBar"><input id="msgInput" placeholder="Write a message..."><button onclick="sendMsg()">→</button></div>
</div>
<script>
let currentChat='Mirich AI';
function openChat(name,letter){
currentChat=name;
document.getElementById('chatName').innerText=name;
document.getElementById('chatAvatar').innerText=letter;
document.getElementById('chatWindow').style.display='flex';
if(name==='Mirich AI'){
document.getElementById('msgs').innerHTML='<div class="bubble other">Hello, I am Mirich AI. Ask me anything in the search bar or here.</div>';
} else {
document.getElementById('msgs').innerHTML='<div class="bubble other">Good day. This is '+name+'.</div>';
}
}
function closeChat(){document.getElementById('chatWindow').style.display='none'}
function addBubble(text,who){
let d=document.createElement('div');d.className='bubble '+who;d.innerText=text;
document.getElementById('msgs').appendChild(d);
document.getElementById('msgs').scrollTop=9999;
}
function mirichReply(q){
q=q.toLowerCase();
if(q.includes('hello')||q.includes('hi')||q.includes('good')) return 'Hello! Good to see you on Mirich. How can I help you today?';
if(q.includes('who are you')||q.includes('your name')) return 'I am Mirich AI, your private assistant inside Mirich. I can help you write messages, answer questions, and find chats.';
if(q.includes('alexander')) return 'Alexander is in your chats. Tap on Alexander to open his chat.';
if(q.includes('sophia')) return 'Sophia is in your chats. Tap on Sophia to open her chat.';
if(q.includes('james')) return 'James is in your chats. Tap on James to open his chat.';
if(q.includes('help')) return 'I can help you: 1) Type a question here, 2) Search for a person, 3) Open a chat and send a message. What do you want to do?';
if(q.includes('thank')) return 'You are welcome. Anything else?';
if(q.includes('bye')) return 'Goodbye for now. I will be here when you need me.';
return 'Great question: "'+q+'". Here is what I think: This is a good idea to explore in Mirich. Tell me more about what you want to do with it, and I will help you plan it step by step.';
}
function askMirich(){
let inp=document.getElementById('searchInput');
let q=inp.value.trim();
if(!q) return;
openChat('Mirich AI','M');
addBubble(q,'me');
setTimeout(function(){ addBubble(mirichReply(q),'other'); },500);
inp.value='';
}
function sendMsg(){
let inp=document.getElementById('msgInput');
if(!inp.value) return;
let q=inp.value;
addBubble(q,'me');
inp.value='';
if(currentChat==='Mirich AI'){
setTimeout(function(){ addBubble(mirichReply(q),'other'); },500);
}
}
document.getElementById('msgInput').addEventListener('keydown',function(e){ if(e.key==='Enter') sendMsg(); });
</script>
</body>
</html>
